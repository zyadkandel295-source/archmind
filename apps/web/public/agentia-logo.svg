<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .agentia-node { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { r: 8; opacity: 1; }
        50% { r: 10; opacity: 0.7; }
      }
    </style>
  </defs>
  
  <!-- Central Control Node -->
  <circle cx="256" cy="256" r="60" fill="white" opacity="1"/>
  
  <!-- Inner Circle (Command Center) -->
  <circle cx="256" cy="256" r="45" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Command Symbol (Arrow/Direction) -->
  <path d="M 256 220 L 275 245 L 256 265 L 237 245 Z" fill="white" opacity="0.9"/>
  
  <!-- Orbital Ring -->
  <circle cx="256" cy="256" r="115" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Agent Nodes (8-point configuration) -->
  <circle class="agentia-node" cx="256" cy="160" r="8" fill="white"/>
  <circle class="agentia-node" cx="320" cy="192" r="8" fill="white" style="animation-delay: 0.1s"/>
  <circle class="agentia-node" cx="340" cy="256" r="8" fill="white" style="animation-delay: 0.2s"/>
  <circle class="agentia-node" cx="320" cy="320" r="8" fill="white" style="animation-delay: 0.3s"/>
  <circle class="agentia-node" cx="256" cy="352" r="8" fill="white" style="animation-delay: 0.4s"/>
  <circle class="agentia-node" cx="192" cy="320" r="8" fill="white" style="animation-delay: 0.5s"/>
  <circle class="agentia-node" cx="172" cy="256" r="8" fill="white" style="animation-delay: 0.6s"/>
  <circle class="agentia-node" cx="192" cy="192" r="8" fill="white" style="animation-delay: 0.7s"/>
  
  <!-- Connecting Lines (System Control) -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="256" x2="320" y2="192" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="256" x2="340" y2="256" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="256" x2="320" y2="320" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="256" x2="256" y2="352" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="256" x2="192" y2="320" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="256" x2="172" y2="256" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="256" x2="192" y2="192" stroke="white" stroke-width="2" opacity="0.6"/>
</svg>
